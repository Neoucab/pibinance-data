name: Update Rates

on:
  schedule:
    # GitHub descarta la mayoría de los eventos `schedule` en repos públicos
    # (medido: ~4,8 corridas/día de 24, con huecos de hasta 9,8 h). Tres
    # entradas por hora multiplican los intentos: sigue siendo gratis y no
    # necesita credenciales de nadie. El disparo fiable sigue siendo el reloj
    # externo de Google Apps Script con `workflow_dispatch` (ver README).
    # Binance P2P siempre; BCV entre mar-vie.
    # Sáb/dom/lun la tasa BCV no cambia: el scraper la actualiza una sola vez
    # dentro de la hora 00 de Venezuela (cualquiera de estos tres crons cae en
    # esa hora).
    - cron: '12 * * * *'
    - cron: '32 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: scrape-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies (versiones fijadas)
        run: pip install -r requirements.txt
      - name: Run scraper
        run: python scraper.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # binance_history.json también se versiona: sin él, la referencia de
          # 24 h nunca acumula puntos y el scraper no puede publicarla.
          git add data.json binance_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): update rates"
            git push
          fi
