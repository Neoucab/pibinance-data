name: Update Rates

on:
  schedule:
    # Corridas horarias (minuto 15): Binance P2P siempre; BCV entre mar-vie.
    # Sáb/dom/lun la tasa BCV no cambia: el scraper la actualiza una sola vez
    # alrededor de las 00:15 Venezuela (publicación diaria del BCV).
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: scrape-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (versiones fijadas)
        run: pip install -r requirements.txt
      - name: Run scraper
        run: python scraper.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # binance_history.json también se versiona: sin él, la referencia de
          # 24 h nunca acumula puntos y el scraper no puede publicarla.
          git add data.json binance_history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): update rates"
            git push
          fi
